<svg id="kernelLaunch-full-flow" class="diagram full-flow" viewBox="0 0 1560 1950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kernelLaunch-full-flow-title kernelLaunch-full-flow-desc"><title id="kernelLaunch-full-flow-title">rtKernelLaunch 六个入参到 Runtime 对象及 Device 下发的完整图</title><desc id="kernelLaunch-full-flow-desc">stm 确定 Stream、Context、Device 和目标 SQ。Runtime 用 stubFunc 的指针值查询注册表，取得 Kernel 对象，再找到 Program 和 Module，由 Module 按需加载设备代码并取得 PC。numBlocks 校验后进入任务。args 与 argsSize 封装并装载为设备参数区。任务构造成 SQE 并发往目标 SQ。smDesc 当前未使用。</desc><defs><marker id="full-flow-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b8091"/></marker></defs><style>
text{font-family:"Times New Roman","SimSun",serif;fill:#243545;text-anchor:middle}.node-title{font-size:28px;font-weight:700}.node-sub{font-size:25px}.column-title{font-size:30px;font-weight:700}.edge-label{font-size:24px;fill:#52697b}.box{stroke:#a9bdcd;stroke-width:1.4;fill:#edf4fa}.box.plain{fill:#f8fafc;stroke:#c5d0d9}.box.green{fill:#edf6f0;stroke:#a3c4b0}.box.amber{fill:#fff5e5;stroke:#d7b789}.edge{stroke:#6b8091;stroke-width:1.8;fill:none;stroke-linecap:butt;stroke-linejoin:miter}.source-trigger{cursor:pointer}.source-trigger:focus .box,.source-trigger:hover .box{stroke:#245c89;stroke-width:2.2}
