lass="box blue"/><text x="500.0" y="998.0" dominant-baseline="middle" class="node-title">启动数量校验</text><text x="500.0" y="1030.0" dominant-baseline="middle" class="node-sub">范围 1 至 65535</text><text x="500.0" y="1062.0" dominant-baseline="middle" class="node-sub">coreDim → uint16_t</text></g><g class="source-trigger" data-node="task" data-x="750" data-y="940" data-w="300" data-h="230"><rect x="750" y="940" width="300" height="230" rx="6" class="box blue"/><text x="900.0" y="991.0" dominant-baseline="middle" class="node-title">TaskInfo / AicTaskInfo</text><text x="900.0" y="1023.0" dominant-baseline="middle" class="node-sub">funcAddr：设备 PC</text><text x="900.0" y="1055.0" dominant-baseline="middle" class="node-sub">comm.dim：Block 数</text><text x="900.0" y="1087.0" dominant-baseline="middle" class="node-sub">comm.args / argsSize</text><text x="900.0" y="1119.0" dominant-baseline="middle" class="node-sub">argHandle：回收凭据</text></g><g class="source-trigger" data-node="sqe" data-x="750" data-y="1250" data-w="300" data-h="170"><rect x="750" y="1250" width="300" height="170" rx="6" class="box blue"/><text x="900.0" y="1287.0" dominant-baseline="middle" class="node-title">rtStarsSqe_t / SQE</text><text x="900.0" y="1319.0" dominant-baseline="middle" class="node-sub">PC · paramAddr</text><text x="900.0" y="1351.0" dominant-baseline="middle" class="node-sub">block_dim · task_id</text><text x="900.0" y="1383.0" dominant-baseline="middle" class="node-sub">调度等配置</text></g><g class="source-trigger" data-node="sq" data-x="1150" data-y="1250" data-w="320" data-h="170"><rect x="1150" y="1250" width="320" height="170" rx="6" class="box green"/><text x="1310.0" y="1287.0" dominant-baseline="middle" class="node-title">目标 Stream 的 SQ</text><text x="1310.0" y="1319.0" dominant-baseline="middle" class="node-sub">接收本次 SQE</text><text x="1310.0" y="1351.0" dominant-baseline="middle" class="node-sub">按 PC 与参数地址执行</text><text x="1310.0" y="1383.0" dominant-baseline="middle" class="node-sub">推进完成状态</text></g><g class="source-trigger" data-node="args" data-x="30" data-y="1450" data-w="220" data-h="110"><rect x="30" y="1450" width="220" height="110" rx="6" class="box plain"/><text x="140.0" y="1489.0" dominant-baseline="middle" class="node-title">③ args</text><text x="140.0" y="1521.0" dominant-baseline="middle" class="node-sub">原始参数缓冲区</text></g><g class="source-trigger" data-node="size" data-x="30" data-y="1600" data-w="220" data-h="110"><rect x="30" y="1600" width="220" height="110" rx="6" class="box plain"/><text x="140.0" y="1639.0" dominant-baseline="middle" class="node-title">④ argsSize</text><text x="140.0" y="1671.0" dominant-baseline="middle" class="node-sub">参数字节数</text></g><g class="source-trigger" data-node="args-info" data-x="350" data-y="1450" data-w="300" data-h="260"><rect x="350" y="1450" width="300" height="260" rx="6" class="box blue"/><text x="500.0" y="1516.0" dominant-baseline="middle" class="node-title">rtArgsEx_t</text><text x="500.0" y="1548.0" dominant-baseline="middle" class="node-sub">args：原始参数地址</text><text x="500.0" y="1580.0" dominant-baseline="middle" class="node-sub">argsSize：参数字节数</text><text x="500.0" y="1612.0" dominant-baseline="middle" class="node-sub">检查地址与参数长度</text><text x="500.0" y="1644.0" dominant-baseline="middle" class="node-sub">按目标流设置拷贝标记</text></g><g class="source-trigger" data-node="load" data-x="750" data-y="1500" data-w="300" data-h="170"><rect x="750" y="1500" width="300" height="170" rx="6" class="box blue"/><text x="900.0" y="1537.0" dominant-baseline="middle" class="node-title">参数装载</text><text x="900.0" y="1569.0" dominant-baseline="middle" class="node-sub">LoadArgsInfo / Load</text><text x="900.0" y="1601.0" dominant-baseline="middle" class="node-sub">公共装载 / 预留 BAR</text><text x="900.0" y="1633.0" dominant-baseline="middle" class="node-sub">SetAicoreArgs 写入任务</text></g><g class="source-trigger" data-node="params" data-x="1150" data-y="1500" data-w="320" data-h="170"><rect x="1150" y="1500" width="320" height="170" rx="6" class="box green"/><text x="1310.0" y="1537.0" dominant-baseline="middle" class="node-title">设备可访问的参数区</text><text x="1310.0" y="1569.0" dominant-baseline="middle" class="node-sub">输入 / 输出地址、标量等</text><text x="1310.0" y="1601.0" dominant-baseline="middle" class="node-sub">comm.args 记录地址</text><text x="1310.0" y="1633.0" dominant-baseline="middle" class="node-sub">SQE 引用此地址</text></g><g class="source-trigger" data-node="sm" data-x="30" data-y="1780" data-w="220" data-h="110"><rect x="30" y="1780" width="220" height="110" rx="6" class="box plain"/><text x="140.0" y="1819.0" dominant-baseline="middle" class="node-title">⑤ smDesc</text><text x="140.0" y="1851.0" dominant-baseline="middle" class="node-sub">当前入口未使用</text></g><g class="source-trigger" data-node="unused" data-x="350" data-y="1780" data-w="700" data-h="110"><rect x="350" y="1780" width="700" height="110" rx="6" class="box amber"/><text x="700.0" y="1819.0" dominant-baseline="middle" class="node-title">UNUSED(smDesc)</text><text x="700.0" y="1851.0" dominant-baseline="middle" class="node-sub">当前实现中不参与任务构造与 Device 下发</text></g><path data-edge="stm-stream" d="M 250 175 L 350 175" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="stream-prepare" d="M 500 250 L 500 370" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="stream-sq" d="M 1050 175 L 1510 175 L 1510 1285 L 1470 1285" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="stub-lookup" d="M 250 440 L 350 440" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="kernel-program" d="M 500 510 L 500 600" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="program-module" d="M 650 690 L 750 690" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="module-code" d="M 1050 690 L 1150 690" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edge="module-pc" d="M 900 780 L 900 940" class="edge " marker-end="url(#full-flow-arrow)"/><path data-edg